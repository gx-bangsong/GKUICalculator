name: Exact fraction numerical tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numerical:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
      - run: ./gradlew testDebugUnitTest --tests com.android.calculator2.ExactFractionTest --stacktrace --console=plain
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: exact-fraction-numerical-results
          path: build/test-results/testDebugUnitTest
