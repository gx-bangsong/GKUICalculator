name: Android UI on emulator

on:
  push:
    branches:
      - 'arena/**'
      - 'lineage-*'
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-ui:
    name: Pixel-style emulator UI checks
    # Ubuntu's KVM-backed emulator is more reliable than the unaccelerated hosted macOS AVD.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Run instrumented UI tests and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6G
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          pre-emulator-launch-script: |
            if [ -e /dev/kvm ]; then echo "::notice title=KVM acceleration::/dev/kvm is available"; else echo "::warning title=KVM acceleration::/dev/kvm is missing"; fi
            echo "::notice title=Android AVD free space::$(df -h "$HOME/.android/avd" | tail -n 1 | sed 's/%/%25/g')"
          script: bash scripts/ci-android-ui-tests.sh

      # Each step gets its own check-annotation budget, so the base64 previews live in steps of
      # their own: inside the test step they were silently truncated and every review read a
      # half-decoded frame.
      # Annotation messages are cut at 4096 chars, so one frame needs several steps of parts.
      - name: Publish default-screen preview (parts 1-10)
        if: always()
        run: bash scripts/ci-publish-preview.sh build/ui-screenshots/calculator-default-review.jpg "VM calculator screenshot" 0
      - name: Publish default-screen preview (parts 11-20)
        if: always()
        run: bash scripts/ci-publish-preview.sh build/ui-screenshots/calculator-default-review.jpg "VM calculator screenshot" 10
      - name: Publish default-screen preview (parts 21+)
        if: always()
        run: bash scripts/ci-publish-preview.sh build/ui-screenshots/calculator-default-review.jpg "VM calculator screenshot" 20
      - name: Publish converter-screen preview (parts 1-10)
        if: always()
        run: bash scripts/ci-publish-preview.sh build/ui-screenshots/calculator-units-review.jpg "VM unit-converter screenshot" 0
      - name: Publish converter-screen preview (parts 11-20)
        if: always()
        run: bash scripts/ci-publish-preview.sh build/ui-screenshots/calculator-units-review.jpg "VM unit-converter screenshot" 10
      - name: Publish converter-screen preview (parts 21+)
        if: always()
        run: bash scripts/ci-publish-preview.sh build/ui-screenshots/calculator-units-review.jpg "VM unit-converter screenshot" 20

      - name: Upload emulator screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: calculator-ui-screenshots
          path: |
            build/ui-screenshots/*.png
            build/ui-screenshots/*-review.jpg
            build/connected-debug-android-test.log
            build/install-debug-android-test.log
            build/outputs/androidTest-results/connected/debug/**
            build/reports/androidTests/connected/debug/**
          if-no-files-found: warn
          retention-days: 14
