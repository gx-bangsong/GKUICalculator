name: Android UI on emulator

on:
  push:
    branches:
      - 'arena/**'
      - 'lineage-*'
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-ui:
    name: Pixel-style emulator UI checks
    # Ubuntu's KVM-backed emulator is more reliable than the unaccelerated hosted macOS AVD.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Run instrumented UI tests and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6G
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          pre-emulator-launch-script: |
            echo "::notice title=Android emulator acceleration::$(emulator -accel-check 2>&1 | tr '\n' ' ')"
            echo "::notice title=Android AVD free space::$(df -h "$HOME/.android/avd" | tail -n 1 | sed 's/%/%25/g')"
          script: bash scripts/ci-android-ui-tests.sh

      - name: Upload emulator screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: calculator-ui-screenshots
          path: |
            build/ui-screenshots/*.png
            build/connected-debug-android-test.log
            build/outputs/androidTest-results/connected/debug/**
            build/reports/androidTests/connected/debug/**
          if-no-files-found: warn
          retention-days: 14
