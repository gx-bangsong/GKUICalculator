name: Android UI on emulator

on:
  push:
    branches:
      - 'arena/**'
      - 'lineage-*'
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-ui:
    name: Pixel-style emulator UI checks
    # Ubuntu's KVM-backed emulator is more reliable than the unaccelerated hosted macOS AVD.
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      # ubuntu-24.04 runners ship /dev/kvm owned root:kvm with 0660; without this the emulator
      # silently falls back to software emulation and every instrumented minute costs several.
      # Same fix as gx-bangsong/GKUIPhotos .github/workflows/ui-screenshots.yml.
      - name: Enable KVM for hosted emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Separate compilation step before emulator launch: compile both main and test APKs
      # so that test code compilation errors are caught before the emulator starts.
      # A successful main APK build does not imply the test APK compiled successfully.
      - name: Compile debug and test APKs
        run: |
          echo "::notice title=Compilation check::Assembling debug and test APKs"
          # build/ does not exist on a fresh checkout; without mkdir the shell redirection below
          # fails instantly and the step reports "compilation failed" without ever running Gradle.
          mkdir -p build
          if ! ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace --console=plain > build/assemble-debug.log 2>&1; then
            echo "::error title=Compilation check failed::Test or main APK compilation failed"
            # Echo the compiler output itself: a generic "compilation failed" annotation makes
            # every failure look identical, and which symbol failed is the only useful part.
            compile_errors=$(grep -nE -A 24 'error:|^e: |What went wrong:|Execution failed for task' build/assemble-debug.log | head -n 65 || true)
            if [[ -z "$compile_errors" ]]; then
              compile_errors=$(tail -n 25 build/assemble-debug.log)
            fi
            while IFS= read -r line; do
              [[ -n "$line" ]] || continue
              safe=$(printf '%s' "${line:0:300}" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | tr '\n' ' ')
              echo "::error title=Compiler output::$safe"
            done <<< "$compile_errors"
            exit 1
          fi
          echo "::notice title=Compilation check::Debug and test APKs assembled successfully"

      - name: Run instrumented UI tests and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6G
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          pre-emulator-launch-script: |
            if [ -e /dev/kvm ]; then echo "::notice title=KVM acceleration::/dev/kvm is available"; else echo "::warning title=KVM acceleration::/dev/kvm is missing"; fi
            if [ -w /dev/kvm ]; then echo "::notice title=KVM permissions::/dev/kvm is writable by $(id -un) (groups: $(id -Gn | tr ' ' ','))"; else echo "::warning title=KVM permissions::/dev/kvm is NOT writable by $(id -un) (groups: $(id -Gn | tr ' ' ',')) - the emulator would fall back to software emulation"; fi
            echo "::notice title=KVM device node::$(ls -l /dev/kvm 2>/dev/null | tr -s ' ' | sed 's/%/%25/g')"
            echo "::notice title=Android AVD free space::$(df -h "$HOME/.android/avd" | tail -n 1 | sed 's/%/%25/g')"
          script: bash scripts/ci-android-ui-tests.sh

      # Each step gets its own check-annotation budget, so the base64 previews live in steps of
      # their own: inside the test step they were silently truncated and every review read a
      # half-decoded frame.
      # Annotation messages are cut at 4096 chars, so one frame needs several steps of parts.
      - name: Publish default-screen preview (parts 1-10)
        if: always()
        run: bash scripts/ci-publish-preview.sh build/ui-screenshots/calculator-default-review.jpg "VM calculator screenshot" 0
      - name: Publish default-screen preview (parts 11-20)
        if: always()
        run: bash scripts/ci-publish-preview.sh build/ui-screenshots/calculator-default-review.jpg "VM calculator screenshot" 10
      - name: Publish default-screen preview (parts 21+)
        if: always()
        run: bash scripts/ci-publish-preview.sh build/ui-screenshots/calculator-default-review.jpg "VM calculator screenshot" 20
      - name: Publish converter-screen preview (parts 1-10)
        if: always()
        run: bash scripts/ci-publish-preview.sh build/ui-screenshots/calculator-units-review.jpg "VM unit-converter screenshot" 0
      - name: Publish converter-screen preview (parts 11-20)
        if: always()
        run: bash scripts/ci-publish-preview.sh build/ui-screenshots/calculator-units-review.jpg "VM unit-converter screenshot" 10
      - name: Publish converter-screen preview (parts 21+)
        if: always()
        run: bash scripts/ci-publish-preview.sh build/ui-screenshots/calculator-units-review.jpg "VM unit-converter screenshot" 20

      - name: Upload emulator screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: calculator-ui-screenshots
          path: |
            build/ui-screenshots/*.png
            build/ui-screenshots/*-review.jpg
            build/connected-debug-android-test.log
            build/install-debug-android-test.log
            build/assemble-debug.log
            build/outputs/androidTest-results/connected/debug/**
            build/reports/androidTests/connected/debug/**
          if-no-files-found: warn
          retention-days: 14
