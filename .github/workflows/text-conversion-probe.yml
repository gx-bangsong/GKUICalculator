name: External text conversion observation
on: workflow_dispatch
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
      - name: Enable hosted emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Observe stock Android 11 classifier and selection menus
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb shell wm dismiss-keyguard
            mkdir -p build/text-conversion-probe
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.android.calculator2.ExternalTextConversionProbeTest --console=plain > build/text-conversion-probe/runner.log 2>&1
            adb exec-out run-as com.android.calculator2.dev cat files/external-text-probe.json > build/text-conversion-probe/report.json
            adb pull /sdcard/external-probe-native.png build/text-conversion-probe/native.png || true
            adb pull /sdcard/external-probe-webview.png build/text-conversion-probe/webview.png || true
      - name: Publish observation, never an integration pass
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('build/text-conversion-probe/report.json')
          if not p.exists():
            log=pathlib.Path('build/text-conversion-probe/runner.log')
            text=log.read_text(errors='replace')[-6000:] if log.exists() else 'Probe did not reach report generation'
          else:
            d=json.loads(p.read_text())
            for key in ('native','webview'):
              if key in d and 'menuHierarchy' in d[key]:
                import re
                d[key]['visibleLabels']=re.findall(r'text="([^"]+)"',d[key].pop('menuHierarchy'))
            text=json.dumps(d,ensure_ascii=False,indent=2)[:14000]
          text=text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::notice title=External text conversion observation::'+text)
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: external-text-conversion-observation
          path: |
            build/text-conversion-probe/
            build/outputs/androidTest-results/
