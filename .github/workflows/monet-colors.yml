name: Monet palette verification
on:
  push:
    branches: ['arena/e012c45b-gkuicalculator']
    paths:
      - '.github/workflows/monet-colors.yml'
      - 'res/**/color.xml'
      - 'res/**/mode_segment_ripple.xml'
      - 'res/color/calculator*'
      - 'res/values/themes.xml'
      - 'androidTest/java/com/android/calculator2/MonetPaletteTest.java'
      - 'scripts/ci-monet-palette-test.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  palette:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [30, 31, 32, 34]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: ./gradlew assembleDebug assembleDebugAndroidTest --console=plain
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/ci-monet-palette-test.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: monet-api${{ matrix.api }}-apk-and-evidence
          path: |
            build/outputs/apk/debug/*.apk
            build/monet-evidence
