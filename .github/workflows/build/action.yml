name: build

runs:
    using: composite

    steps:
    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: 17
        cache: 'gradle'

    - name: Build with Gradle
      shell: bash
      run: |
        log_file="$RUNNER_TEMP/assemble-debug.log"
        if ./gradlew assembleDebug --stacktrace --console=plain >"$log_file" 2>&1; then
          cat "$log_file"
        else
          status=$?
          cat "$log_file"
          diagnostics=$(grep -nEi 'error:|what went wrong|execution failed|^failure:|^> task .* failed|caused by:' "$log_file" | tail -n 40 || true)
          if [[ -z "$diagnostics" ]]; then
            diagnostics=$(tail -n 60 "$log_file")
          fi
          diagnostics=$(printf '%s\n' "$diagnostics" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')
          echo "::error title=assembleDebug failed::$diagnostics"
          exit "$status"
        fi

    - name: Generate Android.bp
      shell: bash
      run: |
        log_file="$RUNNER_TEMP/generate-bp.log"
        if ./gradlew generateBp --stacktrace --console=plain >"$log_file" 2>&1; then
          cat "$log_file"
        else
          status=$?
          cat "$log_file"
          diagnostics=$(grep -nEi 'error:|what went wrong|execution failed|^failure:|^> task .* failed|caused by:' "$log_file" | tail -n 40 || true)
          if [[ -z "$diagnostics" ]]; then
            diagnostics=$(tail -n 60 "$log_file")
          fi
          diagnostics=$(printf '%s\n' "$diagnostics" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')
          echo "::error title=generateBp failed::$diagnostics"
          exit "$status"
        fi

        if [[ -n $(git status -s) ]]; then
          git status
          changes=$(git status --short | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')
          echo "::error title=generateBp changed the working tree::$changes"
          exit 1
        fi

    - uses: actions/upload-artifact@v6
      with:
        name: ExactCalculator-debug.apk
        path: build/outputs/apk/debug/ExactCalculator-debug.apk
