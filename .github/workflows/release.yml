# Human-readable workflow name shown in the Actions tab.
name: production release

# Run after release-branch changes and permit a manual retry/bootstrap run.
on:
  push:
    # The owner selected the repository's existing default branch.
    branches:
      - lineage-23.2
    # Documentation-only changes must not publish a new binary release.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  # Allows the owner to rerun after adding release-signer.sha256.
  workflow_dispatch:

# gh release create needs permission to create tags, releases, and release assets.
permissions:
  contents: write

jobs:
  release:
    # A GitHub-hosted Linux runner supplies git, gh, jq, sha256sum and a preinstalled Android SDK.
    runs-on: ubuntu-latest
    steps:
      # A complete history is mandatory for git rev-list --count HEAD versioning.
      - name: Check out complete source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm release branch before building
        shell: bash
        run: test "$GITHUB_REF" = refs/heads/lineage-23.2

      # Android Gradle Plugin 8.7 is configured for Java 17 in this repository.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ubuntu-latest 已预装 Android SDK（$ANDROID_HOME）。
      # 不使用 android-actions/setup-android：它默认安装已下架的 'tools' 包，必然失败。
      # 若镜像未带 build-tools 35.0.0，则用预装的 sdkmanager 补装；最后两行为自检。
      - name: Set up Android build-tools
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$SDK/build-tools/35.0.0"
          if [ ! -x "$BT/aapt" ]; then
            SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)"
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" 'build-tools;35.0.0'
          fi
          echo "$BT" >> "$GITHUB_PATH"
          "$BT/aapt" version
          "$BT/apksigner" --version

      # The repository script owns decoding, building, validation, naming, and metadata creation.
      - name: Build and validate the production APK
        id: build
        shell: bash
        env:
          # The temporary decoded keystore never enters the repository or release assets.
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE }}
          # Gradle reads these three values through the release signing configuration.
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          # gh reads the previous release's build-info.json for the monotonic version check.
          GH_TOKEN: ${{ github.token }}
          # Missing production signing inputs are fatal in CI.
          CI: 'true'
        run: scripts/ci-build.sh

      # Reviewed Chinese summary is source-controlled; generated PR details are only an appendix.
      - name: Prepare release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ steps.build.outputs.commit }}
          RELEASE_TAG: ${{ steps.build.outputs.tag }}
        run: |
          test "$GITHUB_REF" = refs/heads/lineage-23.2
          test "$(git rev-parse HEAD)" = "$BUILD_SHA"
          PREVIOUS_TAG="$(jq -r .previous_tag releases/next.json)"
          # Refuse an outdated comparison baseline or an existing tag; never move old tags.
          test "$(gh release view --json tagName --jq .tagName)" = "$PREVIOUS_TAG"
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG"; then
            echo "Release tag already exists; refusing to recreate it" >&2
            exit 1
          else
            status=$?
            test "$status" -eq 2
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" -f target_commitish="$BUILD_SHA" \
            -f previous_tag_name="$PREVIOUS_TAG" --jq .body > "$RUNNER_TEMP/pr-appendix.md"
          python3 scripts/render-release-notes.py --sha "$BUILD_SHA" \
            --build-info dist/build-info.json --appendix "$RUNNER_TEMP/pr-appendix.md" \
            --output "$RUNNER_TEMP/release-notes.md"

      # Draft only: an operator must review same-SHA tests/limits before publishing.
      - name: Create review-only GitHub Release draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ steps.build.outputs.commit }}
          RELEASE_TAG: ${{ steps.build.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --target "$BUILD_SHA" --draft \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
